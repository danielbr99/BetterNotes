openapi: 3.1.0
info:
  title: API de Notas Pro
  description: Un sistema de gestión de notas desarrollado bajo estándares SDD.
  version: 1.0.0
  contact:
    name: Daniel
    email: daniel@tuempresa.com

servers:
  - url: http://localhost:4010
    description: Servidor de Mock para desarrollo local

paths:
  /notas:
    get:
      tags:
        - Notas
      summary: Obtener todas las notas
      description: Retorna una lista completa de las notas almacenadas en la base de datos.
      operationId: listarNotas
      responses:
        '200':
          description: Una lista de notas obtenida con éxito.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Nota'
    post:
      tags:
        - Notas
      summary: Crear una nueva nota
      description: Permite al usuario enviar un objeto nota para ser persistido en el sistema.
      operationId: crearNota
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Nota'
      responses:
        '201':
          description: Nota creada con éxito.
        '400':
          description: Datos de entrada inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          
  /notas/{id}:
    get:
      tags:
        - Notas
      summary: Obtener una nota específica
      description: Recupera los detalles de una nota única mediante su identificador.
      operationId: obtenerNotaPorId
      parameters:
        - name: id
          in: path
          required: true
          description: ID único de la nota a recuperar.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Nota encontrada y retornada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Nota'
        '404':
          description: La nota solicitada no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Nota:
      type: object
      required:
        - titulo
        - contenido
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        titulo:
          type: string
          example: "Reunión de Prácticas"
        contenido:
          type: string
          example: "Discutir el avance del proyecto SDD."
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true
    Error:
      type: object
      required:
        - codigo
        - mensaje
      properties:
        codigo:
          type: string
          example: "NOT_FOUND"
        mensaje:
          type: string
          example: "El recurso solicitado no pudo ser localizado."